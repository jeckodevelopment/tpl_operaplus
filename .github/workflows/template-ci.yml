name: Template quality and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: python3 tools/quality_check.py
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Editorial chrome browser regression
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/test_editorial_chrome.mjs
          php tools/render_magazine_fixture.php
          node tools/test_magazine.mjs
          php tools/render_article_layouts.php
          node tools/test_article_layouts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magazine-structure-visuals
          path: dist/magazine/*.png
      - name: Build installable template
        run: python3 tools/package_template.py
      - uses: actions/upload-artifact@v4
        with:
          name: operaplus-template-installable
          path: dist/*.zip
