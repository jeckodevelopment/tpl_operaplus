name: Template quality and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: python3 tools/quality_check.py
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Editorial chrome browser regression
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/test_editorial_chrome.mjs
      - name: Build installable template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import xml.etree.ElementTree as ET
          root=ET.parse('templateDetails.xml').getroot()
          files=set()
          for node in root.findall('./files/*'):
              p=Path(node.text)
              files.update([p] if p.is_file() else [x for x in p.rglob('*') if x.is_file()])
          for node in root.findall('./media/*'):
              p=Path(root.find('media').attrib['folder']) / node.text
              files.update([p] if p.is_file() else [x for x in p.rglob('*') if x.is_file()])
          for node in root.findall('./languages/language'):
              files.add(Path(root.find('languages').attrib['folder']) / node.text)
          Path('dist').mkdir(exist_ok=True)
          with ZipFile('dist/tpl_operaplus-'+root.findtext('version')+'.zip','w',ZIP_DEFLATED) as z:
              for p in sorted(files): z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: operaplus-template-installable
          path: dist/*.zip
