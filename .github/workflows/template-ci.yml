name: Template quality and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: python3 tools/quality_check.py
      - run: python3 tools/verify_mockups.py
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Editorial chrome browser regression
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/test_editorial_chrome.mjs
          php tools/render_magazine_fixture.php
          node tools/test_magazine.mjs
          node tools/test_navigation_accessibility.mjs
          php tools/test_seo.php
          php tools/test_magazine_content.php
          php tools/render_article_layouts.php
          node tools/test_article_layouts.mjs
          node tools/test_design_boards.mjs
      - name: Archive offline design gallery
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path('docs/magazine/mockups')
          with zipfile.ZipFile('dist/magazine-design-gallery.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,'mockups/'+p.relative_to(root).as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magazine-design-boards
          path: |
            dist/design-boards/*.png
            dist/magazine-design-gallery.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magazine-structure-visuals
          path: dist/magazine/*.png
      - name: Build installable template
        run: |
          python3 tools/package_template.py
          cp dist/tpl_operaplus-*.zip "$RUNNER_TEMP/first-package.zip"
          python3 tools/package_template.py
          cmp "$RUNNER_TEMP/first-package.zip" dist/tpl_operaplus-*.zip
          (cd dist && sha256sum --check *.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: operaplus-template-installable
          path: |
            dist/tpl_operaplus-*.zip
            dist/*.sha256
