name: Joomla native template styles
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - joomla: '6.0.0'
            php: '8.3'
            extensions_ref: 74e2bd02c4383ace61af0b56908d8797574d1b15
            checksum: cbf61cbb5e0eacd9db1aed0da93a532d6accbb7d54c36662f3f7432a3e4b573d
            checksum_tool: sha256sum
          - joomla: '6.2.1'
            php: '8.5.13'
            extensions_ref: 31069fce95a261f4065255ab7c73b6886cd69a74
            checksum: 7dc3d9adfef1816c11cf10fc5ec26abd33fa9779
            checksum_tool: sha1sum
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: joomla_test
          MYSQL_USER: joomla_test
          MYSQL_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mysqli, pdo_mysql, mbstring, xml, zip, intl, gd, curl
          coverage: none
      - name: Build current and baseline template packages
        run: |
          python3 tools/package_template.py
          mkdir -p "$RUNNER_TEMP/baseline"
          git archive e542e50e129767eacc4cf125299099a493150c13 | tar -x -C "$RUNNER_TEMP/baseline"
          python3 tools/package_template.py "$RUNNER_TEMP/baseline"
          mkdir -p "$RUNNER_TEMP/preview"
          git archive 8905b91d7e680d9d9333feda547ea6b887187605 | tar -x -C "$RUNNER_TEMP/preview"
          python3 tools/package_template.py "$RUNNER_TEMP/preview"
      - name: Generate disposable Joomla test credentials
        run: |
          password="CiTest-$(openssl rand -hex 16)!"
          echo "::add-mask::$password"
          echo "JOOMLA_TEST_USER=ciadmin" >> "$GITHUB_ENV"
          echo "JOOMLA_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Install official Joomla ${{ matrix.joomla }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 -o "$RUNNER_TEMP/joomla.zip" https://github.com/joomla/joomla-cms/releases/download/${{ matrix.joomla }}/Joomla_${{ matrix.joomla }}-Stable-Full_Package.zip
          echo "${{ matrix.checksum }}  $RUNNER_TEMP/joomla.zip" | ${{ matrix.checksum_tool }} --check
          mkdir -p "$RUNNER_TEMP/joomla"
          unzip -q "$RUNNER_TEMP/joomla.zip" -d "$RUNNER_TEMP/joomla"
          cd "$RUNNER_TEMP/joomla"
          php installation/joomla.php install --no-interaction --site-name="OperaPlus CI" --admin-user="CI Administrator" --admin-username="$JOOMLA_TEST_USER" --admin-password="$JOOMLA_TEST_PASSWORD" --admin-email=ci@example.invalid --db-type=mysqli --db-host=127.0.0.1 --db-user=joomla_test --db-pass=ci-test-password --db-name=joomla_test --db-prefix=ci_ --db-encryption=0 --public-folder=""
      - name: Verify fresh install, upgrade and idempotent style creation
        env:
          JOOMLA_ROOT: ${{ runner.temp }}/joomla
          MYSQL_PWD: ci-test-password
        run: bash tools/test_template_styles.sh
      - name: Checkout pinned editorial extensions
        uses: actions/checkout@v4
        with:
          repository: jeckodevelopment/operaplus-extensions
          ref: ${{ matrix.extensions_ref }}
          path: .ci-extensions
          persist-credentials: false
      - name: Verify real Magazine integration with pinned extensions
        env:
          JOOMLA_ROOT: ${{ runner.temp }}/joomla
          MYSQL_PWD: ci-test-password
        run: bash tools/test_editorial_integration.sh
