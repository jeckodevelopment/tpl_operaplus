name: Verify live stable template feed
on:
  push:
    branches: [main]
    paths: ['updates/stable.xml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify live feed and package
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --location --max-time 30 -o "$RUNNER_TEMP/feed.xml" https://raw.githubusercontent.com/jeckodevelopment/tpl_operaplus/main/updates/stable.xml && cmp -s updates/stable.xml "$RUNNER_TEMP/feed.xml"; then
              break
            fi
            sleep 10
          done
          cmp updates/stable.xml "$RUNNER_TEMP/feed.xml"
          python3 - <<'PY'
          import hashlib, os, pathlib, re, urllib.request, xml.etree.ElementTree as ET, zipfile
          p = pathlib.Path(os.environ['RUNNER_TEMP'])
          for u in ET.parse(p / 'feed.xml').getroot().findall('update'):
              version = u.findtext('version')
              assert re.fullmatch(r'\d+\.\d+\.\d+', version)
              assert u.findtext('tags/tag') == 'stable'
              assert u.findtext('element') == 'operaplus'
              assert u.findtext('type') == 'template'
              assert u.findtext('client') == 'site'
              url = u.findtext('downloads/downloadurl')
              assert url == f'https://github.com/jeckodevelopment/tpl_operaplus/releases/download/v{version}/tpl_operaplus-{version}.zip'
              pkg = p / 'package.zip'
              urllib.request.urlretrieve(url, pkg)
              digest = hashlib.sha256(pkg.read_bytes()).hexdigest()
              assert digest == u.findtext('sha256')
              with zipfile.ZipFile(pkg) as z:
                  assert z.testzip() is None
                  assert ET.fromstring(z.read('templateDetails.xml')).findtext('version') == version
              print('Live stable update feed and public package verified:', version, digest)
          PY
