TPL_OPERAPLUS_ADMIN_DOCUMENTATION="Documentation"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC01="Introduction and settings"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC01_DESC="Settings are grouped into Branding (logo, footer, favicon and Open Graph), Appearance (light/dark theme and width), Headings (separate H1–H5 and hero H1 sizes) and Navigation (dropdowns and mega menus). The default page H1 size is 48 px; the hero H1 is independent. Values already saved in a Joomla style remain unchanged after an update."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC02="Module positions"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC02_DESC="Publish native modules in these positions: menu (main menu), hero (Custom module assigned only to the homepage), sidebar-left/sidebar-right (menu, login, search), breadcrumb (breadcrumbs), pre-footer (CTA), or main-top/main-bottom and the editorial positions. Hide the hero module title if it already contains an H1."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC03="Main menu and mega menu"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC03_DESC="Create a Joomla Menu module in the menu position; enable Show Sub-menu Items and set End Level to All. Normal dropdown: native parent and child items. Mega menu: in the parent menu item → Link Type → Link Class, enter op-mega; level 2 = column headings, level 3 = links. Set columns, width and interaction in Navigation. Parent items remain navigable links."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC04="Sidebar menus and user modules"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC04_DESC="Place Menu modules in the sidebars without special classes: submenus are compact and active branches expand. Arrow controls are separate from links. Login, password reset, registration, search and Joomla messages automatically receive the light or dark theme styles. Do not copy module HTML into the template."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC05="Homepage hero"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC05_DESC="Create a Custom module in the hero position, visible only on the homepage. Use p.op-eyebrow for the kicker, h1 for the heading, p.op-hero-lead for the description and a.op-button for the CTA. Add .op-button--outline for a secondary button. Configure the logo and side image in Branding and the hero-side position. Hero H1 sizing is independent of page headings."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC06="Native Joomla courses"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC06_DESC="Create a category with the alias corsi, then an Articles → Category Blog menu item. Each course is a Joomla article: Title = opera, Author Alias = composer, Intro Image = list cover, Full Article Image = detail cover; tags and text are native. The blog displays the button via TPL_OPERAPLUS_DISCOVER_COURSE. The detail has no fixed editorial headings: it uses the category according to Joomla settings. Other categories retain the standard Joomla layout."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC07="Editorial containers and grids"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC07_DESC="Classes for Custom modules and articles: .op-container = centred width; .op-section/.op-section-alt = section and background variant; .op-split (and .op-split--reverse) = two side-by-side blocks; .op-grid-2, .op-grid-3, .op-grid-4 and .op-cards = responsive grids; .op-editorial-grid with .op-editorial-main and .op-editorial-aside = 12-column editorial grid; .op-section-heading = section heading."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC08="Cards, panels and images"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC08_DESC="Classes: .op-card = card; .op-panel-light, .op-panel-dark, .op-panel-bordeaux = preset coloured panels; .op-media = media cropped to the intended proportions (do not use for covers that must remain intact); .op-course-feature with __art and __body = custom course presentation. Course category overrides instead use proportional uncropped covers."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC09="Typography and components"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC09_DESC="Classes: .op-eyebrow/.op-kicker/.op-overline = kickers; .op-display = display heading; .op-lead = introductory text; .op-quote = quotation; .op-stat = numeric metric; .op-number = highlighted number; .op-tag/.op-course-tag = labels; .op-rule/.op-divider = dividers; .op-button and .op-button--outline = buttons; .op-pill and .op-pill-list = inline labels. Configure H1–H5 under Headings."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC10="Custom course components"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC10_DESC="For optional editorial content in an article or Custom module: .op-course-intro for introduction; .op-course-feature, .op-course-feature__art and __body for a course card; .op-course-meta and .op-course-status for metadata; .op-course-note for a note; .op-course-chapters and .op-course-chapter for chapters; .op-course-lessons for lessons; .op-course-cta for a CTA. These are not required by the normal category blog, which uses its own override."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC11="Branding and social metadata"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC11_DESC="Branding includes PNG/SVG favicon (or ICO path) and a default Open Graph image (1200×630 px recommended). Existing SEO extension metadata takes precedence; otherwise article full/intro image, menu image and the default image follow. Images are selected from Joomla data. A social metadata error must not prevent pages from loading."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC12="Translations and language overrides"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC12_DESC="Go to System → Languages → Overrides (select the appropriate site language). Main keys: TPL_OPERAPLUS_DISCOVER_COURSE = course button, TPL_OPERAPLUS_NO_COURSES = empty list, TPL_OPERAPLUS_SKIP = skip to content, TPL_OPERAPLUS_MENU = menu label, TPL_OPERAPLUS_XML_DESCRIPTION = template description. Branding fields include TPL_OPERAPLUS_FAVICON, TPL_OPERAPLUS_FAVICON_PATH and TPL_OPERAPLUS_OG_IMAGE; descriptions end in _DESC. Other TPL_OPERAPLUS_* keys define administration option labels: see language/it-IT and language/en-GB."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC13="Quick example for a Custom module"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC13_DESC="HTML example to copy in code mode: &lt;p class=&quot;op-eyebrow&quot;&gt;THE PROJECT&lt;/p&gt; &lt;h2&gt;Discover Opera+&lt;/h2&gt; &lt;p class=&quot;op-lead&quot;&gt;A listening journey.&lt;/p&gt; &lt;a class=&quot;op-button&quot; href=&quot;/corsi/&quot;&gt;Explore courses&lt;/a&gt;. Ensure the editor and Joomla filters preserve the classes."
