TPL_OPERAPLUS_SOCIAL_DOC_TITLE="Favicon and social image"
TPL_OPERAPLUS_SOCIAL_DOC_DESC="Branding supports PNG/SVG favicon (or an .ico path) and a default OG image. Existing og:image from SEO plugins is preserved; otherwise the menu image, article intro image or template fallback is used. The menu may provide an image through the native Menu Image field, or an og_image parameter provided by an extension. Recommended OG image: 1200×630 px. Each Joomla template style has its own settings."