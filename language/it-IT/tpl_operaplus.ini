TPL_OPERAPLUS_ADMIN_DOCUMENTATION="Documentazione"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC01="Introduzione e impostazioni"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC01_DESC="Le impostazioni sono divise in Branding (logo, footer, favicon e Open Graph), Aspetto (tema chiaro/scuro, larghezza), Titoli (H1–H5 e H1 Hero distinti) e Navigazione (dropdown e mega menu). La dimensione predefinita degli H1 nel corpo pagina è 48 px; il valore H1 Hero è indipendente. I valori già salvati in uno stile Joomla restano invariati dopo un aggiornamento."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC02="Posizioni modulo"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC02_DESC="Pubblica i moduli nativi nelle posizioni: menu (menu principale), hero (modulo Personalizzato assegnato solo alla homepage), sidebar-left/sidebar-right (menu, login, ricerca), breadcrumb (Percorso di navigazione), pre-footer (CTA), oppure main-top/main-bottom e le posizioni editoriali. Nascondi il titolo del modulo Hero quando contiene già un H1."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC03="Menu principale e mega menu"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC03_DESC="Crea un modulo Joomla Menu in posizione menu; abilita Mostra voci sottomenu e Livello finale Tutti. Dropdown normale: voci padre e figlie native. Mega menu: nella voce padre → Tipo link → Classe CSS collegamento inserisci op-mega; livello 2 = intestazioni colonne, livello 3 = link. Colonne, larghezza e apertura si impostano in Navigazione. Le voci padre rimangono link navigabili."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC04="Menu laterali e moduli utente"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC04_DESC="Colloca il modulo Menu nelle sidebar, senza classi particolari: i sottomenu sono compatti e i rami attivi espansi. I controlli con freccia sono separati dal collegamento. Moduli Login, Recupero password, Registrazione, Ricerca e messaggi Joomla ricevono automaticamente gli stili del tema chiaro o scuro. Non copiare HTML del modulo nel template."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC05="Hero della homepage"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC05_DESC="Crea un modulo Personalizzato nella posizione hero, visibile solo in Home. Inserisci p.op-eyebrow per il soprattitolo, h1 per il titolo, p.op-hero-lead per la descrizione e a.op-button per la CTA. Puoi aggiungere .op-button--outline per un pulsante secondario. Logo e immagine laterale si configurano in Branding/posizione hero-side. L’H1 Hero ha un controllo dimensionale separato dagli H1 della pagina."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC06="Corsi nativi Joomla"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC06_DESC="Crea una categoria con alias corsi, poi una voce di menu Articoli → Blog di categoria. Ogni corso è un articolo Joomla: Titolo = opera, Alias autore = compositore, Immagine introduttiva = copertina nella lista, Immagine articolo completo = copertina nella scheda, tag e testo sono nativi. Il blog mostra il pulsante tramite TPL_OPERAPLUS_DISCOVER_COURSE. Il dettaglio non contiene titoli editoriali fissi: usa la categoria secondo la configurazione Joomla. Altre categorie conservano il layout Joomla standard."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC07="Contenitori e griglie editoriali"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC07_DESC="Classi per moduli Personalizzati/articoli: .op-container = ampiezza centrata; .op-section/.op-section-alt = sezione e variante sfondo; .op-split (e .op-split--reverse) = due blocchi affiancati; .op-grid-2, .op-grid-3, .op-grid-4 e .op-cards = griglie responsive; .op-editorial-grid con .op-editorial-main e .op-editorial-aside = editoriale 12 colonne; .op-section-heading = intestazione di sezione."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC08="Schede, pannelli e immagini"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC08_DESC="Classi: .op-card = card; .op-panel-light, .op-panel-dark, .op-panel-bordeaux = pannelli con colori prestabiliti; .op-media = media ritagliato secondo proporzioni previste (non usarlo per copertine da preservare); .op-course-feature con __art e __body = presentazione corso personalizzata. Le copertine negli override della categoria corsi usano invece dimensioni proporzionali senza taglio."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC09="Tipografia e componenti"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC09_DESC="Classi: .op-eyebrow/.op-kicker/.op-overline = soprattitoli; .op-display = titolo display; .op-lead = testo introduttivo; .op-quote = citazione; .op-stat = dato numerico; .op-number = numero evidenziato; .op-tag/.op-course-tag = etichette; .op-rule/.op-divider = separatori; .op-button e .op-button--outline = pulsanti; .op-pill e .op-pill-list = etichette in elenco. I titoli H1–H5 si configurano in Titoli."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC10="Componenti di un corso personalizzato"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC10_DESC="Per contenuti editoriali opzionali in un articolo o modulo Personalizzato: .op-course-intro per introduzione; .op-course-feature, .op-course-feature__art e __body per scheda; .op-course-meta e .op-course-status per metadati; .op-course-note per nota; .op-course-chapters e .op-course-chapter per capitoli; .op-course-lessons per lezioni; .op-course-cta per CTA. Non servono per il normale blog di categoria, che usa il proprio override."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC11="Branding e metadati social"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC11_DESC="Branding contiene favicon PNG/SVG (oppure percorso ICO) e immagine Open Graph predefinita (consigliati 1200×630 px). La precedenza OG è: metadati già impostati da estensioni SEO, immagine specifica della voce menu se prevista, immagine introduttiva o completa dell’articolo, immagine predefinita. Le immagini vengono scelte mediante i dati Joomla. Un errore nella lettura di metadati social non deve bloccare le pagine."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC12="Traduzioni e sostituzioni lingua"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC12_DESC="Vai in Sistema → Lingue → Sostituzioni lingua (lingua sito appropriata). Principali chiavi: TPL_OPERAPLUS_DISCOVER_COURSE = pulsante corso, TPL_OPERAPLUS_NO_COURSES = elenco vuoto, TPL_OPERAPLUS_SKIP = salta al contenuto, TPL_OPERAPLUS_MENU = etichetta menu, TPL_OPERAPLUS_XML_DESCRIPTION = descrizione template. I campi Branding sono etichettati con TPL_OPERAPLUS_FAVICON, TPL_OPERAPLUS_FAVICON_PATH e TPL_OPERAPLUS_OG_IMAGE; le descrizioni terminano con _DESC. Le altre chiavi TPL_OPERAPLUS_* definiscono etichette delle opzioni amministrative: consulta i file language/it-IT e language/en-GB."
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC13="Esempio rapido per modulo Personalizzato"
TPL_OPERAPLUS_ADMIN_OP_DOC_TOPIC13_DESC="Esempio HTML da copiare in modalità codice: &lt;p class=&quot;op-eyebrow&quot;&gt;IL PROGETTO&lt;/p&gt; &lt;h2&gt;Scopri Opera+&lt;/h2&gt; &lt;p class=&quot;op-lead&quot;&gt;Un percorso di ascolto.&lt;/p&gt; &lt;a class=&quot;op-button&quot; href=&quot;/corsi/&quot;&gt;Scopri i corsi&lt;/a&gt;. Controlla che editor e filtri Joomla conservino le classi."
