TPL_OPERAPLUS_OG_IMAGE_DESC="Immagine fallback per le condivisioni social, preferibilmente 1200×630 px. Priorità: metadati SEO già presenti, immagine voce di menu, immagine introduttiva articolo, fallback del template."
TPL_OPERAPLUS_SOCIAL_DOC_TITLE="Favicon e immagine social"
TPL_OPERAPLUS_SOCIAL_DOC_DESC="Branding: favicon PNG/SVG (oppure percorso .ico) e immagine OG predefinita. Il template rispetta un og:image già prodotto da plugin SEO; altrimenti usa l’immagine del menu, l’immagine introduttiva dell’articolo e infine quella predefinita. Per la voce menu puoi usare Immagine menu o il parametro og_image se reso disponibile da una estensione. Per immagini OG usare 1200×630 px. I campi sono indipendenti per ciascuno stile Joomla."

